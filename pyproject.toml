[tool.poetry]
package-mode = false

[tool.poetry.dependencies]
python = "~3.15"
django = "~6.1"
requests = "~2.34"
psycopg2-binary = "~2.9"
whitenoise = "~6.12"
tna-frontend-jinja = "1.6.0"
tna-utilities = "~1.9"

[tool.poetry.group.dev]
optional = true

[tool.poetry.group.dev.dependencies]
requests-mock = "~1.12"
pytest-django = "~4.14"

[tool.pytest.ini_options]
testpaths = [
    "test",
]
DJANGO_SETTINGS_MODULE = "config.settings.test"
